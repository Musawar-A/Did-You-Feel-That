                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${VerifierLambda}"
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${UserLambda}"
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${IngestionLambda}"
                    ],
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${NotifierLambda}"
                    ]
                  ]
                }
              }
            ]
          }


  # ------------------------------------------------
  # CloudWatch Alarms - EC2
  # ------------------------------------------------

  WebServer1HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-EC2-HighCPU"
      Namespace: AWS/EC2
      MetricName: CPUUtilization

      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServer1

      Statistic: Average
      Period: 300

      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  WebServer1StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-EC2-StatusCheckFailed"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed

      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServer1

      Statistic: Maximum
      Period: 300

      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  WebServer2HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-EC2-2-HighCPU"
      Namespace: AWS/EC2
      MetricName: CPUUtilization

      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServer2

      Statistic: Average
      Period: 300

      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  WebServer2StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-EC2-2-StatusCheckFailed"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed

      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServer2

      Statistic: Maximum
      Period: 300

      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  # ------------------------------------------------
  # CloudWatch Alarms - ALB
  # ------------------------------------------------

  AlbUnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-ALB-UnhealthyTargets"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount

      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt DyftLoadBalancer.LoadBalancerFullName

      Statistic: Maximum
      Period: 300

      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  AlbTargetConnectionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-ALB-TargetConnectionErrors"
      Namespace: AWS/ApplicationELB
      MetricName: TargetConnectionErrorCount

      Dimensions:
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName
        - Name: LoadBalancer
          Value: !GetAtt DyftLoadBalancer.LoadBalancerFullName

      Statistic: Sum
      Period: 300

      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  # ------------------------------------------------
  # CloudWatch Alarm - API Gateway
  # ------------------------------------------------

  UserApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-API-5XXErrors"
      Namespace: AWS/ApiGateway
      MetricName: 5XXError

      Dimensions:
        - Name: ApiName
          Value: !Sub "${DeploymentPrefix}-user-api"

      Statistic: Sum
      Period: 300

      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic


  # ------------------------------------------------
  # CloudWatch Alarm - Verifier Lambda
  # ------------------------------------------------

  VerifierLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentPrefix}-VerifierLambda-Errors"
      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref VerifierLambda

      Statistic: Sum
      Period: 300

      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: missing

      AlarmActions:
        - !Ref OperationsAlertsTopic

# ------------------------------------------------
# Outputs
# ------------------------------------------------

Outputs:

  LoadBalancerDNS:
    Description: DNS name of the DYFT Application Load Balancer.
    Value: !GetAtt DyftLoadBalancer.DNSName


  UserApiUrl:
    Description: DYFT user API endpoint.
    Value: !Sub >
      https://${UserRestApi}.execute-api.${AWS::Region}.amazonaws.com/dyft-dev/users


  ReportsApiUrl:
    Description: DYFT reports API stage endpoint.
    Value: !Sub >
      https://${ReportsRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod


  CognitoUserPoolId:
    Description: Cognito User Pool ID.
    Value: !Ref DyftUserPool


  CognitoAppClientId:
    Description: Cognito App Client ID.
    Value: !Ref DyftUserPoolClient


  NotificationQueueUrl:
    Description: Main DYFT SQS notification queue URL.
    Value: !Ref NotificationQueue


  NotificationQueueArn:
    Description: Main DYFT SQS notification queue ARN.
    Value: !GetAtt NotificationQueue.Arn


  OperationsAlertsTopicArn:
    Description: SNS topic used for operational CloudWatch alerts.
    Value: !Ref OperationsAlertsTopic


  EffectiveFrontendOrigin:
    Description: Frontend origin configured for API Gateway and Lambda CORS.
    Value: !If
      - HasFrontendOrigin
      - !Ref FrontendOrigin
      - !If
        - HasCertificate
        - !Sub "https://${DyftLoadBalancer.DNSName}"
        - !Sub "http://${DyftLoadBalancer.DNSName}"


  WebServer1InstanceId:
    Description: First DYFT EC2 instance.
    Value: !Ref WebServer1


  WebServer2InstanceId:
    Description: Second DYFT EC2 instance.
    Value: !Ref WebServer2
