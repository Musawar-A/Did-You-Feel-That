AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Did You Feel That (DYFT) infrastructure for COMPX527.

Parameters:

  DeploymentPrefix:
    Type: String
    Default: DYFT-AUTO
    Description: Prefix used for resources created by the automated test deployment.

  WebServerAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Public SSM parameter for the latest Amazon Linux 2023 x86_64 AMI.

  RepositoryUrl:
    Type: String
    Default: https://github.com/Musawar-A/dyft-compx527.git
    Description: Public Git repository cloned by EC2 web servers.

  RepositoryBranch:
    Type: String
    Default: main
    Description: Git branch checked out by EC2 web servers.

  CertificateArn:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional ARN of an existing ACM or IAM TLS certificate used by the ALB HTTPS listener.

  FrontendOrigin:
    Type: String
    Default: ""
    Description: Optional allowed frontend origin for API Gateway and Lambda CORS responses.

  OperationsAlertEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to DYFT CloudWatch operational alerts.

  SesSenderEmail:
    Type: String
    Default: ""
    Description: Optional SES-verified sender email address used by the notifier Lambda.


Conditions:

  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCertificate: !Not [!Condition HasCertificate]
  HasFrontendOrigin: !Not [!Equals [!Ref FrontendOrigin, ""]]
  HasOperationsAlertEmail: !Not [!Equals [!Ref OperationsAlertEmail, ""]]


Resources:

  # ------------------------------------------------
  # Networking
  # ------------------------------------------------

  DyftVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.52.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-VPC"


  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-IGW"


  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref DyftVpc


  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DyftVpc
      CidrBlock: 10.52.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-PublicSubnet1"


  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DyftVpc
      CidrBlock: 10.52.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-PublicSubnet2"


  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DyftVpc
      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-PublicRoutes"


  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1


  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # ------------------------------------------------
  # DynamoDB
  # ------------------------------------------------

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${DeploymentPrefix}-REPORTS"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL


  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${DeploymentPrefix}-USERS"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: "USER#"
          AttributeType: S

      KeySchema:
        - AttributeName: "USER#"
          KeyType: HASH


  # ------------------------------------------------
  # SQS
  # ------------------------------------------------

  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DeploymentPrefix}-DidntYouGetThat"
      VisibilityTimeout: 30
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 0


  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${DeploymentPrefix}-DidYouQueueThat"

      VisibilityTimeout: 60

      MessageRetentionPeriod: 345600

      ReceiveMessageWaitTimeSeconds: 20

      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 3


  # ------------------------------------------------
  # IAM - Lambda roles
  # ------------------------------------------------

  ValidationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentPrefix}-ValidationLambdaRole"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: DYFT-ValidationLambda-DynamoDBWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt ReportsTable.Arn

              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub "${ReportsTable.Arn}/index/GSI1"


  VerifierLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentPrefix}-VerifierLambdaRole"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: DYFT-VerifierLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ReportsTable.Arn

              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt NotificationQueue.Arn


  NotifierLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentPrefix}-NotifierLambdaRole"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: DYFT-NotifierLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt NotificationQueue.Arn

              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt UsersTable.Arn

              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"


  UserWriteLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentPrefix}-UserWriteLambdaRole"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: DYFT-UserDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt UsersTable.Arn

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${DeploymentPrefix}-SeismicVerifierSchedulerRole"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: DYFT-SeismicVerifierSchedulerInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt VerifierLambda.Arn


  # ------------------------------------------------
  # Lambda functions
  # ------------------------------------------------

  IngestionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${DeploymentPrefix}-Ingestion"

      Runtime: python3.14
      Handler: index.lambda_handler
      Architectures:
        - x86_64

      MemorySize: 128
      Timeout: 3

      Role: !GetAtt ValidationLambdaRole.Arn
      
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref ReportsTable
          FRONTEND_ORIGIN: !If
            - HasFrontendOrigin
            - !Ref FrontendOrigin
            - !If
              - HasCertificate
              - !Sub "https://${DyftLoadBalancer.DNSName}"
              - !Sub "http://${DyftLoadBalancer.DNSName}"

      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 503,
                  "body": "Deployment placeholder"
              }


  NotifierLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${DeploymentPrefix}-Notifier"

      Runtime: python3.14
      Handler: index.lambda_handler
      Architectures:
        - x86_64

      MemorySize: 128
      Timeout: 3

      Role: !GetAtt NotifierLambdaRole.Arn

      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          SES_SENDER_EMAIL: !Ref SesSenderEmail

      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 503,
                  "body": "Deployment placeholder"
              }


  UserLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${DeploymentPrefix}-COGNITO"

      Runtime: python3.14
      Handler: index.lambda_handler
      Architectures:
        - x86_64

      MemorySize: 128
      Timeout: 3

      Role: !GetAtt UserWriteLambdaRole.Arn

      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          FRONTEND_ORIGIN: !If
            - HasFrontendOrigin
            - !Ref FrontendOrigin
            - !If
              - HasCertificate
              - !Sub "https://${DyftLoadBalancer.DNSName}"
              - !Sub "http://${DyftLoadBalancer.DNSName}"

      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 503,
                  "body": "Deployment placeholder"
              }


  VerifierLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${DeploymentPrefix}-SeismicVerifier"

      Runtime: python3.14
      Handler: index.lambda_handler
      Architectures:
        - x86_64

      MemorySize: 128
      Timeout: 15

      Role: !GetAtt VerifierLambdaRole.Arn

      Environment:
        Variables:
          DB_TABLE_NAME: !Ref ReportsTable
          QUEUE_URL: !Ref NotificationQueue
          LOOKBACK_MINUTES: "60"
          USE_MOCK_DATA: "true"

      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  "statusCode": 503,
                  "body": "Deployment placeholder"
              }


  # ------------------------------------------------
  # SQS to Notifier Lambda
  # ------------------------------------------------

  NotifierSQSEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt NotificationQueue.Arn
      FunctionName: !Ref NotifierLambda
      BatchSize: 10
      Enabled: true

  # ------------------------------------------------
  # Cognito
  # ------------------------------------------------

  DyftUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${DeploymentPrefix}-userpool"

      UsernameConfiguration:
        CaseSensitive: false

      AliasAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

      MfaConfiguration: "OFF"


  DyftUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${DeploymentPrefix}-appclient"
      UserPoolId: !Ref DyftUserPool

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH


  # ------------------------------------------------
  # API Gateway - User API
  # ------------------------------------------------

  UserRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${DeploymentPrefix}-user-api"
      EndpointConfiguration:
        Types:
          - REGIONAL


  UserApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UserRestApi
      ParentId: !GetAtt UserRestApi.RootResourceId
      PathPart: users


  UserApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: dyft-cognito-authorizer
      RestApiId: !Ref UserRestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt DyftUserPool.Arn


  UserPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UserRestApi
      ResourceId: !Ref UserApiResource
      HttpMethod: POST

      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref UserApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt UserLambda.Arn


  UserOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UserRestApi
      ResourceId: !Ref UserApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE

      Integration:
        Type: MOCK

        RequestTemplates:
          application/json: |
            {"statusCode": 200}

        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: >-
                'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
              method.response.header.Access-Control-Allow-Methods: >-
                'OPTIONS,POST'
              method.response.header.Access-Control-Allow-Origin: !If
                - HasFrontendOrigin
                - !Sub "'${FrontendOrigin}'"
                - !If
                  - HasCertificate
                  - !Sub "'https://${DyftLoadBalancer.DNSName}'"
                  - !Sub "'http://${DyftLoadBalancer.DNSName}'"

      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true


  UserLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UserRestApi}/*/POST/users"


  UserApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UserPostMethod
      - UserOptionsMethod
    Properties:
      RestApiId: !Ref UserRestApi


  UserApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref UserRestApi
      DeploymentId: !Ref UserApiDeployment
      StageName: dyft-dev

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5


  # ------------------------------------------------
  # API Gateway - Reports API
  # ------------------------------------------------

  ReportsRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${DeploymentPrefix}-ReportAPI"
      EndpointConfiguration:
        Types:
          - REGIONAL


  ReportsApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ReportsRestApi
      ParentId: !GetAtt ReportsRestApi.RootResourceId
      PathPart: reports


  ReportsApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: reportapi-cognito-authorizer
      RestApiId: !Ref ReportsRestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt DyftUserPool.Arn


  ReportsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ReportsRestApi
      ResourceId: !Ref ReportsApiResource
      HttpMethod: POST

      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ReportsApiAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - LambdaArn: !GetAtt IngestionLambda.Arn


  ReportsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ReportsRestApi
      ResourceId: !Ref ReportsApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE

      Integration:
        Type: MOCK

        RequestTemplates:
          application/json: |
            {"statusCode": 200}

        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: >-
                'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
              method.response.header.Access-Control-Allow-Methods: >-
                'OPTIONS,POST'
              method.response.header.Access-Control-Allow-Origin: !If
                - HasFrontendOrigin
                - !Sub "'${FrontendOrigin}'"
                - !If
                  - HasCertificate
                  - !Sub "'https://${DyftLoadBalancer.DNSName}'"
                  - !Sub "'http://${DyftLoadBalancer.DNSName}'"

      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true


  IngestionLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReportsRestApi}/*/POST/reports"


  ReportsApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ReportsPostMethod
      - ReportsOptionsMethod
    Properties:
      RestApiId: !Ref ReportsRestApi


  ReportsApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ReportsRestApi
      DeploymentId: !Ref ReportsApiDeployment
      StageName: prod

      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

  # ------------------------------------------------
  # SNS - Operational alerts
  # ------------------------------------------------

  OperationsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${DeploymentPrefix}-OperationsAlerts"


  OperationsAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasOperationsAlertEmail
    Properties:
      TopicArn: !Ref OperationsAlertsTopic
      Protocol: email
      Endpoint: !Ref OperationsAlertEmail


  # ------------------------------------------------
  # EventBridge Scheduler
  # ------------------------------------------------

  SeismicVerifierSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${DeploymentPrefix}-SeismicVerifier-15Min"

      Description: >
        Calls the DYFT-SeismicVerifier Lambda Function every 15 minutes.

      ScheduleExpression: rate(15 minutes)

      ScheduleExpressionTimezone: Pacific/Auckland

      State: ENABLED

      FlexibleTimeWindow:
        Mode: "OFF"

      Target:
        Arn: !GetAtt VerifierLambda.Arn

        RoleArn: !GetAtt SchedulerInvokeRole.Arn

        RetryPolicy:
          MaximumEventAgeInSeconds: 86400
          MaximumRetryAttempts: 185

  # ------------------------------------------------
  # Security Groups
  # ------------------------------------------------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${DeploymentPrefix}-ALB-SG"
      GroupDescription: Allow public HTTP/HTTPS traffic to the DYFT ALB.
      VpcId: !Ref DyftVpc

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${DeploymentPrefix}-EC2-SG"
      GroupDescription: Allow web traffic only from the DYFT ALB.
      VpcId: !Ref DyftVpc

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


  # ------------------------------------------------
  # EC2 Web Servers
  # ------------------------------------------------

  WebServer1:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicDefaultRoute
      - PublicSubnet1RouteTableAssociation
    Properties:
      ImageId: !Ref WebServerAmiId
      InstanceType: t3.micro
      SubnetId: !Ref PublicSubnet1

      SecurityGroupIds:
        - !Ref Ec2SecurityGroup

      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-EC2-1"

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf update -y
          dnf install -y git nginx

          dnf install -y nodejs22 nodejs22-npm

          rm -rf /home/ec2-user/dyft-compx527
          git clone --branch ${RepositoryBranch} --single-branch ${RepositoryUrl} /home/ec2-user/dyft-compx527
          chown -R ec2-user:ec2-user /home/ec2-user/dyft-compx527

          cd /home/ec2-user/dyft-compx527/frontend

          cat > .env <<EOF
          VITE_COGNITO_USER_POOL_ID=${DyftUserPool}
          VITE_COGNITO_USER_POOL_CLIENT_ID=${DyftUserPoolClient}
          VITE_API_GATEWAY_URL_USERS=https://${UserRestApi}.execute-api.${AWS::Region}.amazonaws.com/dyft-dev/users
          VITE_API_GATEWAY_URL_REPORTS=https://${ReportsRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
          EOF
          chown ec2-user:ec2-user .env

          sudo -u ec2-user npm ci
          sudo -u ec2-user npm run build

          rm -rf /usr/share/nginx/html/*
          cp -r dist/* /usr/share/nginx/html/
          chown -R nginx:nginx /usr/share/nginx/html
          find /usr/share/nginx/html -type d -exec chmod 755 {} \;
          find /usr/share/nginx/html -type f -exec chmod 644 {} \;

          systemctl enable nginx
          systemctl restart nginx


  WebServer2:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicDefaultRoute
      - PublicSubnet2RouteTableAssociation
    Properties:
      ImageId: !Ref WebServerAmiId
      InstanceType: t3.micro
      SubnetId: !Ref PublicSubnet2

      SecurityGroupIds:
        - !Ref Ec2SecurityGroup

      Tags:
        - Key: Name
          Value: !Sub "${DeploymentPrefix}-EC2-2"

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf update -y
          dnf install -y git nginx

          dnf install -y nodejs22 nodejs22-npm

          rm -rf /home/ec2-user/dyft-compx527
          git clone --branch ${RepositoryBranch} --single-branch ${RepositoryUrl} /home/ec2-user/dyft-compx527
          chown -R ec2-user:ec2-user /home/ec2-user/dyft-compx527

          cd /home/ec2-user/dyft-compx527/frontend

          cat > .env <<EOF
          VITE_COGNITO_USER_POOL_ID=${DyftUserPool}
          VITE_COGNITO_USER_POOL_CLIENT_ID=${DyftUserPoolClient}
          VITE_API_GATEWAY_URL_USERS=https://${UserRestApi}.execute-api.${AWS::Region}.amazonaws.com/dyft-dev/users
          VITE_API_GATEWAY_URL_REPORTS=https://${ReportsRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
          EOF
          chown ec2-user:ec2-user .env

          sudo -u ec2-user npm ci
          sudo -u ec2-user npm run build

          rm -rf /usr/share/nginx/html/*
          cp -r dist/* /usr/share/nginx/html/
          chown -R nginx:nginx /usr/share/nginx/html
          find /usr/share/nginx/html -type d -exec chmod 755 {} \;
          find /usr/share/nginx/html -type f -exec chmod 644 {} \;

          systemctl enable nginx
          systemctl restart nginx


  # ------------------------------------------------
  # Target Group
  # ------------------------------------------------

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${DeploymentPrefix}-EC2-TG"

      VpcId: !Ref DyftVpc

      Protocol: HTTP
      Port: 80

      TargetType: instance

      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2

      Matcher:
        HttpCode: "200"

      Targets:
        - Id: !Ref WebServer1
          Port: 80
        - Id: !Ref WebServer2
          Port: 80

      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "300"

        - Key: stickiness.enabled
          Value: "false"


  # ------------------------------------------------
  # Application Load Balancer
  # ------------------------------------------------

  DyftLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${DeploymentPrefix}-ALB"

      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4

      SecurityGroups:
        - !Ref AlbSecurityGroup

      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"

        - Key: routing.http2.enabled
          Value: "true"

        - Key: deletion_protection.enabled
          Value: "false"


  # ------------------------------------------------
  # ALB Listeners
  # ------------------------------------------------

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref DyftLoadBalancer

      Protocol: HTTP
      Port: 80

      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301


  HttpForwardListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCertificate
    Properties:
      LoadBalancerArn: !Ref DyftLoadBalancer

      Protocol: HTTP
      Port: 80

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup


  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref DyftLoadBalancer

      Protocol: HTTPS
      Port: 443

      Certificates:
        - CertificateArn: !Ref CertificateArn

      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

    # ------------------------------------------------
  # CloudWatch Dashboard
  # ------------------------------------------------

  DyftMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${DeploymentPrefix}-Monitoring"

      DashboardBody:
        Fn::Sub: |
          {
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "EC2 CPU Utilization",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "metrics": [
                    [
                      "AWS/EC2",
                      "CPUUtilization",
                      "InstanceId",
                      "${WebServer1}"
                    ],
                    [
                      "AWS/EC2",
                      "CPUUtilization",
                      "InstanceId",
                      "${WebServer2}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "ALB Target Health",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 60,
                  "stat": "Average",
                  "metrics": [
                    [
                      "AWS/ApplicationELB",
                      "HealthyHostCount",
                      "TargetGroup",
                      "${WebTargetGroup.TargetGroupFullName}",
                      "LoadBalancer",
                      "${DyftLoadBalancer.LoadBalancerFullName}"
                    ],
                    [
                      "AWS/ApplicationELB",
                      "UnHealthyHostCount",
                      "TargetGroup",
                      "${WebTargetGroup.TargetGroupFullName}",
                      "LoadBalancer",
                      "${DyftLoadBalancer.LoadBalancerFullName}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 6,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "ALB Requests",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApplicationELB",
                      "RequestCount",
                      "TargetGroup",
                      "${WebTargetGroup.TargetGroupFullName}",
                      "LoadBalancer",
                      "${DyftLoadBalancer.LoadBalancerFullName}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 8,
                "y": 6,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "ALB Target Response Time",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "metrics": [
                    [
                      "AWS/ApplicationELB",
                      "TargetResponseTime",
                      "TargetGroup",
                      "${WebTargetGroup.TargetGroupFullName}",
                      "LoadBalancer",
                      "${DyftLoadBalancer.LoadBalancerFullName}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 16,
                "y": 6,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "ALB Target Connection Errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApplicationELB",
                      "TargetConnectionErrorCount",
                      "TargetGroup",
                      "${WebTargetGroup.TargetGroupFullName}",
                      "LoadBalancer",
                      "${DyftLoadBalancer.LoadBalancerFullName}"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 12,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API Gateway Requests",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "Count",
                      "ApiName",
                      "${DeploymentPrefix}-user-api"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 12,
                "y": 12,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API Gateway 5XX Errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "5XXError",
                      "ApiName",
                      "${DeploymentPrefix}-user-api"
                    ]
                  ]
                }
              },

              {
                "type": "metric",
                "x": 0,
                "y": 18,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Lambda Invocations",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
